[pytest]
testpaths = tests
markers =
    real_latex: needs pdflatex and pdfinfo on this machine
    network: hits the live internet (set PIPELINE_NET_TESTS=1)
    wsl: needs a responding WSL distro
    real_toast: shows a real Windows toast
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
